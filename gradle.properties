org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.caching=true
# Parallel execution and the configuration cache are both off: neither Fabric Loom nor
# ModDevGradle's legacy-Forge mode supports the configuration cache, and the three loader
# toolchains do not like being configured concurrently.
org.gradle.parallel=false
org.gradle.configuration-cache=false

