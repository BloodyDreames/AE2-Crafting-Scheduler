plugins {
    id 'base'
}

// Shared source roots. Each loader project adds the ones that apply to its Minecraft version;
// they are compiled separately per target, against that target's Minecraft and AE2 jars.
ext {
    commonJava = rootProject.file('common/src/main/java')
    commonResources = rootProject.file('common/src/main/resources')
    mc1201Java = rootProject.file('mc1201/src/main/java')
    mc1201Resources = rootProject.file('mc1201/src/main/resources')
    mc1211Java = rootProject.file('mc1211/src/main/java')
    mc1211Resources = rootProject.file('mc1211/src/main/resources')
}

subprojects {
    apply plugin: 'java-library'

    version = "${mod_version}"
    group = "${mod_group_id}"

    repositories {
        mavenCentral()
        maven {
            name = 'ModMaven (AE2)'
            url = 'https://modmaven.dev'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Collects the three production jars into build/libs at the repository root so a release can be
// picked up from one place.
tasks.register('collectArtifacts', Copy) {
    group = 'build'
    description = 'Copies every production jar into the root build/libs directory.'
    into layout.buildDirectory.dir('libs')
    subprojects.each { sub ->
        dependsOn "${sub.path}:build"
        from(sub.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar'
            exclude '*-dev.jar'
            exclude '*-dev-shadow.jar'
        }
    }
}
